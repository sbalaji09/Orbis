version: "3.8"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=https://hwozsjclqerkxkzkbxmc.supabase.co
      - DIRECT_CONNECTION=postgresql://postgres.hwozsjclqerkxzkbxmc:b5nXH6Sdyc422xzN@aws-1-us-west-1.pooler.supabase.com:6543/postgres
      - ANON_KEY=your_anon_key_here
      - SECRET_KEY=your_secret_key_here
    volumes:
      - ./backend:/app

  postgres:
    image: postgres:15-alpine
    container_name: orbis-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_postgres_password_here
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
